name: Build KO Android Kiosk

on:
  push:
    branches:
      - feature/ko-check-in-kiosk
    paths:
      - "android-kiosk/**"
      - ".github/workflows/android-kiosk.yml"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install Android 35 SDK
        run: |
          SDKMANAGER=/usr/local/lib/android/sdk/cmdline-tools/latest/bin/sdkmanager
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.10.2"

      - name: Build debug APK
        run: gradle -p android-kiosk assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: KingdomOverflow-Kiosk-debug
          path: android-kiosk/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
